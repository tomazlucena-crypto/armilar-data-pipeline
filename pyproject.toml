[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armilar-data-pipeline"
version = "0.10.9"
description = "Auditable acquisition and construction pipeline for the ICP 2021 Armilar weight matrix"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Armilar Project"}]
dependencies = []

[project.optional-dependencies]
sdmx = ["sdmx1>=2.26,<3"]
test = ["hypothesis>=6.100,<7", "pytest>=8,<9", "PyYAML>=6,<7", "tzdata>=2024.1"]
temporal = ["duckdb>=1.1,<2"]
proxies = ["openpyxl>=3.1,<4"]

[project.scripts]
armilar-pre-release-backtest-v094 = "armilar_prices.pre_release_backtest_v094:main"
armilar-information-set-v093 = "armilar_prices.information_set_v093:main"
armilar-first-published-v093 = "armilar_prices.first_published_v093:main"
armilar-release-time-backtest-v093 = "armilar_prices.release_time_backtest_v093:main"
armilar-vintage-sensitivity-v093 = "armilar_prices.vintage_sensitivity_v093:main"
armilar-temporal-safeguard-v092 = "armilar_prices.temporal_safeguard_v092:main"
armilar-paired-diagnostics-v091 = "armilar_prices.paired_diagnostics_v091:main"
armilar-eurostat-headline = "armilar_prices.eurostat_headline_v090:main"
armilar-backtest-v090 = "armilar_prices.backtest_v090:main"
armilar-data = "armilar_pipeline.cli:main"
armilar-source-probe = "armilar_source_probe.cli:main"
armilar-proxy-audit = "armilar_proxy_audit.cli:main"
armilar-country = "armilar_country_adapters.cli:main"
armilar-matrix = "armilar_matrix_builder.cli:main"
armilar-global-weights = "armilar_global_weights.cli:main"
armilar-imputation = "armilar_global_weights.imputation_cli:main"
armilar-global-release = "armilar_global_weights.release_cli:main"
armilar-prices = "armilar_prices.cli:main"
armilar-official-engine-v096 = "armilar_prices.official_engine_v096:main"
armilar-proxies-v097 = "armilar_proxies.registry_v097:main"
armilar-proxy-information-v098 = "armilar_proxies.information_set_v098:main"
armilar-proxy-features-v099 = "armilar_proxies.feature_panel_v099:main"
armilar-backtest-v0100 = "armilar_backtest.cli_v0100:main"
armilar-arm-o-bridge-v0101 = "armilar_backtest.arm_o_materialization_v0101:main"
armilar-ecoicop-v2-transition-v0102 = "armilar_backtest.ecoicop_v2_transition_v0102:main"
armilar-ecoicop-v2-backtest-v0103 = "armilar_backtest.ecoicop_v2_backtest_v0103:main"
armilar-ecoicop-dual-panel-v0104 = "armilar_backtest.ecoicop_dual_panel_v0104:main"
armilar-ecoicop-dual-panel-replay-v0105 = "armilar_backtest.ecoicop_dual_panel_replay_v0105:main"
armilar-ecoicop-dual-panel-materialize-v0106 = "armilar_backtest.ecoicop_dual_panel_materialization_v0106:main"
armilar-ecoicop-dual-panel-attach-v0107 = "armilar_backtest.ecoicop_dual_panel_attachment_v0107:main"
armilar-ecoicop-transition-backtest-v0108 = "armilar_backtest.ecoicop_transition_backtest_v0108:main"
armilar-ecoicop-transition-backtest-execution-v0109 = "armilar_backtest.ecoicop_transition_backtest_execution_v0109:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
